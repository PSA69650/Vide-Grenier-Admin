<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #273c75; margin-bottom: 25px; border-bottom: 3px solid #fbc531; display: inline-block; padding-bottom: 5px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #273c75; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #1c2d5a; }
        .error-msg { color: #e74c3c; font-size: 0.9rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Connexion Admin</h2>
    <input type="email" id="email" placeholder="Email admin" required>
    <input type="password" id="password" placeholder="Mot de passe" required>
    <button id="authBtn" onclick="seConnecter()">Se connecter</button>
    <p id="messageErreur" class="error-msg"></p>
</div>

<script>
    const SUPABASE_URL = "https://dawnqgtitjrqmqnnrhky.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhd25xZ3RpdGpycW1xbm5yaGt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMDIxMjcsImV4cCI6MjA5Mjc3ODEyN30.M4KyikZlZ8Sb_2sTA3O4GCloLktTH4Z8p789cf89FUU";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Vérification au chargement : si déjà connecté, on va au menu
    window.onload = async () => {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            window.location.replace("menu_admin.html");
        }
    };

    async function seConnecter() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('authBtn');

        btn.innerText = "Connexion...";
        btn.disabled = true;

        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
            alert("Erreur : " + error.message);
            btn.innerText = "Se connecter";
            btn.disabled = false;
        } else {
            window.location.replace("menu_admin.html");
        }
    }
</script>
</body>
</html>
