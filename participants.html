<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Participants - Les Ginettes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #273c75; --secondary: #fbc531; --danger: #e74c3c; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: var(--primary); margin: 0; border-left: 5px solid var(--secondary); padding-left: 15px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: var(--primary); color: white; }
        
        .btn { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; color: white; }
        .btn-add { background: var(--success); }
        .btn-edit { background: var(--secondary); color: var(--primary); margin-right: 5px; }
        .btn-back { background: #7f8c8d; text-decoration: none; padding: 8px 15px; font-size: 0.9rem; border-radius: 6px; color: white; }

        /* Style de la modale */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 5% auto; padding: 30px; border-radius: 10px; width: 80%; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <a href="menu_admin.html" class="btn-back">⬅ Menu</a>
        <h2>Liste des Participants</h2>
        <button class="btn btn-add" onclick="ouvrirModale()">+ Nouveau Participant</button>
    </div>

    <table id="tableParticipants">
        <thead>
            <tr>
                <th>Nom & Prénom</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Ville</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="corpsTableau">
            <tr><td colspan="5">Chargement sécurisé...</td></tr>
        </tbody>
    </table>
</div>

<!-- Modale Formulaire -->
<div id="modalParticipant" class="modal">
    <div class="modal-content">
        <h3 id="modalTitre">Nouveau Participant</h3>
        <input type="hidden" id="editId">
        <div class="form-group"><label>Nom</label><input type="text" id="pNom"></div>
        <div class="form-group"><label>Prénom</label><input type="text" id="pPrenom"></div>
        <div class="form-group"><label>Email</label><input type="email" id="pEmail"></div>
        <div class="form-group"><label>Téléphone</label><input type="text" id="pTel"></div>
        <div class="form-group"><label>Ville</label><input type="text" id="pVille"></div>
        <div style="text-align: right; margin-top: 20px;">
            <button class="btn" style="background:#bdc3c7;" onclick="fermerModale()">Annuler</button>
            <button id="saveBtn" class="btn btn-add" onclick="enregistrer()">Enregistrer</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://dawnqgtitjrqmqnnrhky.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhd25xZ3RpdGpycW1xbm5yaGt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMDIxMjcsImV4cCI6MjA5Mjc3ODEyN30.M4KyikZlZ8Sb_2sTA3O4GCloLktTH4Z8p789cf89FUU";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let listeLocale = [];

    // --- FORMATION : Casser la boucle GitHub ---
    _supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
            if (!session) {
                window.location.replace("admin.html");
            } else {
                chargerDonnees();
            }
        }
    });

    async function chargerDonnees() {
        const { data, error } = await _supabase.from('participants').select('*').order('nom');
        if (error) {
            alert("Erreur de chargement : " + error.message);
            return;
        }
        listeLocale = data;
        afficherTableau(data);
    }

    function afficherTableau(data) {
        const corps = document.getElementById('corpsTableau');
        corps.innerHTML = data.map(p => `
            <tr>
                <td><b>${(p.nom || '').toUpperCase()}</b> ${p.prenom || ''}</td>
                <td>${p.email || '-'}</td>
                <td>${p.telephone || '-'}</td>
                <td>${p.adresse_ville || '-'}</td>
                <td>
                    <button class="btn btn-edit" onclick="preparerModif('${p.id}')">Modifier</button>
                </td>
            </tr>
        `).join('');
    }

    async function enregistrer() {
        const id = document.getElementById('editId').value;
        const p = {
            nom: document.getElementById('pNom').value,
            prenom: document.getElementById('pPrenom').value,
            email: document.getElementById('pEmail').value,
            telephone: document.getElementById('pTel').value,
            adresse_ville: document.getElementById('pVille').value
        };

        const btn = document.getElementById('saveBtn');
        btn.disabled = true;

        const { error } = id 
            ? await _supabase.from('participants').update(p).eq('id', id)
            : await _supabase.from('participants').insert([p]);

        if (error) {
            alert(error.message);
            btn.disabled = false;
        } else {
            fermerModale();
            chargerDonnees();
            btn.disabled = false;
        }
    }

    // --- INTERFACE ---
    function ouvrirModale() {
        document.getElementById('modalParticipant').style.display = 'block';
        document.getElementById('editId').value = "";
        document.getElementById('modalTitre').innerText = "Nouveau Participant";
        ['pNom', 'pPrenom', 'pEmail', 'pTel', 'pVille'].forEach(id => document.getElementById(id).value = "");
    }

    function fermerModale() { document.getElementById('modalParticipant').style.display = 'none'; }

    function preparerModif(id) {
        const p = listeLocale.find(x => x.id === id);
        ouvrirModale();
        document.getElementById('modalTitre').innerText = "Modifier " + p.nom;
        document.getElementById('editId').value = p.id;
        document.getElementById('pNom').value = p.nom;
        document.getElementById('pPrenom').value = p.prenom;
        document.getElementById('pEmail').value = p.email || "";
        document.getElementById('pTel').value = p.telephone || "";
        document.getElementById('pVille').value = p.adresse_ville || "";
    }
</script>
</body>
</html>
